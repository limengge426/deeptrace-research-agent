[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchloop"
version = "0.1.0"
description = "An evidence-first, resumable research agent: plan, research in parallel, write a cited report, verify, repeat."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Limeng Ge" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
researchloop = "researchloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/researchloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
