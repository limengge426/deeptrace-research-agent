[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeptrace-agent"
version = "0.3.0"
description = "An evidence-first, resumable research agent: plan, research in parallel, write a cited report, verify, repeat."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Limeng Ge" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
deeptrace = "deeptrace_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptrace_agent"]
# The built web console is gitignored but must ship in the wheel when present.
artifacts = ["src/deeptrace_agent/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
