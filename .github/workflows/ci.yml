name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  postgres:
    # The store, leases (FOR UPDATE SKIP LOCKED) and workers against a real Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deeptrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_store_postgres.py -rs
        env:
          DEEPTRACE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deeptrace

  neo4j:
    # Knowledge-graph build and entity-linked graph retrieval against a real Neo4j.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/ci-test-password
        ports: ["7687:7687"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase
          for _ in range(60):
              try:
                  with GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "ci-test-password")) as d:
                      d.verify_connectivity()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j did not start")
          PY
      - run: pytest -q tests/test_graph.py -rs
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: ci-test-password

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run build:demo

  deploy-drill:
    # API + two worker processes; one worker is SIGKILLed mid-run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bash evals/deploy_drill.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Build image
        run: docker build -t deeptrace .
      - name: Run a research job inside the container against a mock LLM
        run: |
          python evals/mock_llm_server.py --host 0.0.0.0 --port 9100 &
          docker run -d --name rl --network host \
            -e DEEPTRACE_API_KEY=mock \
            -e DEEPTRACE_BASE_URL=http://127.0.0.1:9100/v1 \
            -e DEEPTRACE_CORPUS=/app/examples/corpus \
            deeptrace
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          id=$(curl -sf -X POST localhost:8000/runs -H 'content-type: application/json' \
                 -d '{"question": "Are heat pumps worth it in cold climates?"}' | python -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 60); do
            status=$(curl -sf localhost:8000/runs/$id | python -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "status: $status"
            [ "$status" = done ] && break
            sleep 1
          done
          curl -sf localhost:8000/runs/$id/report | tee report.md | head -20
          grep -q "## Sources" report.md
          curl -sf localhost:8000/ | grep -q 'id="root"'   # the web console is served at /
          curl -sf localhost:8000/runs/$id/state | python -c 'import sys,json; s=json.load(sys.stdin); assert s["report"]["sections"]' 
      - if: failure()
        run: docker logs rl
