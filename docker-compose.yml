# One API process plus two worker replicas sharing a SQLite database on a volume.
# Workers coordinate through leases: each run is driven by one worker at a time,
# and a run whose worker dies is taken over once its lease expires.
#
#   cp .env.example .env    # add your model key
#   docker compose up --build
#
# SQLite in WAL mode is safe for several processes on one host (one Docker
# volume), but not on a network filesystem shared across machines.

x-common: &common
  build: .
  env_file: .env
  environment:
    DEEPTRACE_DB: /data/deeptrace.db
    DEEPTRACE_CORPUS: ${DEEPTRACE_CORPUS:-/app/examples/corpus}
  volumes:
    - data:/data

services:
  api:
    <<: *common
    command: ["deeptrace", "serve", "--host", "0.0.0.0", "--port", "8000", "--no-worker"]
    ports:
      - "8000:8000"

  worker:
    <<: *common
    command: ["deeptrace", "worker", "--max-active", "2"]
    healthcheck:
      disable: true
    deploy:
      replicas: 2

  # Optional backing services, started with --profile:
  #   docker compose --profile postgres up   then set DEEPTRACE_DB=postgresql+psycopg://deeptrace:deeptrace@postgres/deeptrace
  #   docker compose --profile graph up      then set NEO4J_URI=bolt://neo4j:7687 and DEEPTRACE_RETRIEVAL=graph
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: deeptrace
      POSTGRES_PASSWORD: deeptrace
      POSTGRES_DB: deeptrace
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
    volumes:
      - neo4jdata:/data

volumes:
  data:
  pgdata:
  neo4jdata:
